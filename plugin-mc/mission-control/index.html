<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="bar">
  <span class="pdot" id="pdot"></span>
  <span class="proj" id="proj">mission control</span>
  <span class="acct" id="acct" title="Claude account this machine's sessions run on"></span>
  <span class="usage" id="usage"></span>
  <span class="state" id="stateTxt"></span>
  <span class="offpill">reconnecting</span>
  <span class="spacer"></span>
  <span class="svc" id="svcDots" data-tip="Windows running in the machine"></span>
  <button class="hbtn" id="newSess" data-tip="Start a Claude session inside the machine"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Session</span></button>
  <div class="fleetmenu">
    <button class="hbtn" id="fleetBtn" data-tip="Every machine on this host"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span id="fleetName">Fleet</span></button>
    <div class="fleetpop" id="fleetPop"></div>
  </div>
  <div class="fleetmenu">
    <button class="hbtn" id="machineBtn" data-tip="This machine — handoff age, pause, stop"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg><span id="handoffAge">machine</span></button>
    <div class="fleetpop" id="machinePop">
      <div class="mp-h" id="handoffWhen">handoff —</div>
      <button class="mp-a" id="pauseBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span><b>Pause</b>handoff, services down, session kept</span></button>
      <button class="mp-a bad" id="stopBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg><span><b>Stop</b>handoff, services down, session killed</span></button>
    </div>
  </div>
  <button class="hbtn icon" id="themeBtn" data-tip="Theme: auto" aria-label="Switch theme"></button>
  <button class="hbtn" id="streamBtn" data-tip="Event stream, gates and replies (⌘K for commands)"><svg class="ico" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Stream</span><span class="nbadge" id="unread"></span></button>
</header>

<nav class="side" id="side" aria-label="Navigation"><div class="sd-inner" id="sideInner"></div></nav>

<div class="gridwrap">
  <div class="grid" id="grid"></div>
  <div class="dead">
    <h1>Machine offline</h1>
    <p>Mission control lost its server. From the project root:</p>
    <p><code>bash &lt;plugin&gt;/scripts/orchestrator.sh</code></p>
    <p id="lastseen" style="font-size:12px;color:var(--mut2)"></p>
  </div>
</div>

<div class="dock">
  <div class="composer">
    <textarea id="ta" rows="1" placeholder="Tell the machine anything — it goes to the orchestrator…"></textarea>
    <button class="sendbtn" id="sendBtn" data-tip="Send to the orchestrator (Enter)" aria-label="Send"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</div>

<div class="cmdk" id="cmdk">
  <div class="cmdbox">
    <input id="cmdInput" placeholder="Search tiles, actions…  (open a panel, approve, switch theme)" autocomplete="off">
    <div class="cmdlist" id="cmdList"></div>
    <div class="cmdhint"><span>↑↓ navigate</span><span>↵ run</span><span>esc close</span><span style="margin-left:auto">⌘K</span></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Event stream">
  <div class="d-h">
    <svg class="ico" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span id="d-title" style="display:flex;align-items:center;gap:6px"><span class="name">Stream</span><span class="sub">the story, oldest → newest</span></span>
    <button class="x" id="drawerX" data-tip="Close (Esc)" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="d-scroll" id="dscroll"></div>
  <div class="dock" style="border-top:1px solid var(--line)">
    <div class="composer">
      <textarea id="ta2" rows="1" placeholder="Reply in the stream…"></textarea>
      <button class="sendbtn" id="sendBtn2" data-tip="Send (Enter)" aria-label="Send"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</aside>

<script type="module" src="/js/boot.js"></script>
</body>
</html>
