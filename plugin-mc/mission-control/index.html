<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  /* tokens come from theme.json — server.js renders them here on every request */
  /*__TOKENS__*/
  :root{--r:4px;--r2:6px;--t:160ms cubic-bezier(.2,.7,.2,1)}
  *{box-sizing:border-box}
  html{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 var(--sans);
       height:100vh;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;
       font-feature-settings:"tnum","cv01","cv09","ss03";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font:inherit;cursor:pointer;color:inherit;border:0;background:none;padding:0}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r2)}
  ::selection{background:var(--acc-dim)}
  .ico{width:16px;height:16px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

  /* tooltips: any element with data-tip explains itself on hover/focus */
  [data-tip]{position:relative}
  [data-tip]::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);transform:translate(-50%,-4px);
    background:var(--ink);color:var(--bg);font:500 11.5px/1.3 var(--sans);padding:6px 9px;border-radius:var(--r2);white-space:nowrap;
    pointer-events:none;opacity:0;transition:opacity var(--t),transform var(--t);z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  [data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0);transition-delay:.35s}
  .bar [data-tip]::after,.t-h [data-tip]::after{left:auto;right:0;transform:translate(0,-4px)}
  .bar [data-tip]:hover::after,.t-h [data-tip]:hover::after{transform:translate(0,0)}
  .side [data-tip]::after{left:calc(100% + 10px);top:50%;transform:translate(-4px,-50%)}
  .side [data-tip]:hover::after{transform:translate(0,-50%)}

  /* one pill, everywhere a count or a state is shown */
  .pill,.cnt,.tag,.nbadge,.chip i{display:inline-flex;align-items:center;justify-content:center;gap:5px;
    font:500 11px var(--mono);font-style:normal;line-height:1;padding:3px 7px;border-radius:99px;
    border:1px solid var(--line2);color:var(--mut);background:none;white-space:nowrap}
  .pill.acc,.nbadge,.tile.alert .cnt{background:var(--acc);color:var(--acc-ink);border-color:transparent}
  .nbadge:empty{display:none}

  /* ---------- top bar ---------- */
  .bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;height:48px;padding:0 14px 0 16px;border-bottom:1px solid var(--line);
       background:var(--surface);flex:none;position:relative;z-index:6}
  .pdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px var(--ok-dim)}
  .pdot.down{background:var(--bad);box-shadow:0 0 0 3px var(--bad-dim)}
  .proj{font-weight:600;font-size:14px;letter-spacing:-.01em}
  .acct{font:11.5px var(--mono);color:var(--mut);padding-left:12px;border-left:1px solid var(--line)}
  .acct:empty{display:none}
  .state{color:var(--mut);font-size:12.5px}
  .usage{display:flex;gap:6px}
  .usage .pill .warn{color:var(--warn)} .usage .pill .bad{color:var(--bad)}
  .spacer{flex:1}
  .svc{display:flex;gap:5px;align-items:center;padding:0 6px}
  .svc i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
  .svc i.w{background:var(--warn)} .svc i.b{background:var(--bad)}
  .hbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:var(--r2);font-size:12.5px;font-weight:500;color:var(--mut);
        transition:background var(--t),color var(--t)}
  .hbtn .ico{width:17px;height:17px}
  .hbtn:hover{background:var(--raise);color:var(--ink)}
  .hbtn.icon{width:32px;padding:0;justify-content:center}
  .fleetmenu{position:relative}
  .fleetpop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--line2);
            border-radius:var(--r2);padding:4px;min-width:200px;display:none;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:20}
  .fleetpop.open{display:block;animation:pop var(--t)}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}}
  .fleetpop a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:var(--r);font-size:12.5px;color:var(--mut)}
  .fleetpop a:hover{background:var(--raise);color:var(--ink)}
  .fleetpop a.me{color:var(--ink);font-weight:500}

  /* ---------- sidebar: 56px icon rail, expands on hover, pin to keep open ---------- */
  .side{grid-row:2;grid-column:1;position:relative;width:56px;transition:width var(--t);z-index:7}
  .side.pin{width:236px}
  .side.pin .sd-inner{width:236px}
  .sd-inner{position:absolute;left:0;top:0;bottom:0;width:56px;overflow:hidden auto;scrollbar-width:none;border-right:1px solid var(--line);background:var(--surface);
            display:flex;flex-direction:column;gap:2px;padding:8px;transition:width var(--t)}
  .side:not(.pin):hover .sd-inner{width:236px;box-shadow:20px 0 48px rgba(0,0,0,.22)}
  .sd-g{font:500 11px/1 var(--mono);color:var(--mut2);padding:12px 10px 5px;white-space:nowrap;overflow:hidden;height:28px;flex:none;opacity:0;transition:opacity var(--t)}
  .side:not(.pin):not(:hover) .sd-g{height:10px;padding:0}
  .sd-i{display:flex;align-items:center;gap:10px;height:34px;padding:0 9px;border-radius:var(--r2);color:var(--mut);white-space:nowrap;
        position:relative;width:100%;text-align:left;flex:none;cursor:pointer;transition:background var(--t),color var(--t)}
  .sd-i:hover{background:var(--raise);color:var(--ink)}
  .sd-i.on{background:var(--acc-dim);color:var(--ink)}
  .sd-i.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--acc)}
  .sd-i.alert{color:var(--acc)}
  .sd-i .ico{flex:none;width:19px;height:19px;stroke-width:1.6}
  .sd-i .dot{position:absolute;left:25px;bottom:7px;width:7px;height:7px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
  .sd-i .dot.off{background:var(--mut2)}
  .sd-i .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px;opacity:0;transition:opacity var(--t)}
  .side.pin .sd-i .lb,.side:hover .sd-i .lb,.side.pin .sd-g,.side:hover .sd-g{opacity:1}
  .sd-i i{font:500 10.5px var(--mono);font-style:normal;line-height:1;padding:2px 6px;border-radius:99px;border:1px solid var(--line2);color:var(--mut);flex:none}
  .sd-i.alert i{background:var(--acc);color:var(--acc-ink);border-color:transparent}
  .side:not(.pin):not(:hover) .sd-i i{position:absolute;top:2px;right:2px;padding:1px 4px;font-size:9.5px}
  .sd-i .pinb{flex:none;opacity:0;color:var(--mut2);padding:3px;border-radius:var(--r);display:inline-flex;transition:opacity var(--t),color var(--t)}
  .sd-i .pinb .ico{width:14px;height:14px}
  .side.pin .sd-i:hover .pinb,.side:hover .sd-i:hover .pinb{opacity:1}
  .sd-i .pinb:hover{color:var(--ink);background:var(--line)}
  .sd-i .pinb.on{opacity:.7;color:var(--ink)}
  .sd-foot{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;position:sticky;bottom:0;background:var(--surface);flex:none}

  /* ---------- main area ---------- */
  .gridwrap{grid-row:2;grid-column:2;overflow-y:auto;min-height:0;min-width:0;background:var(--bg)}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;padding:14px;align-content:start}
  .tile{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;min-width:0;
        animation:tile-in var(--t)}
  @keyframes tile-in{from{opacity:0;transform:translateY(4px)}}
  .tile.s{grid-column:span 4;height:320px} .tile.m{grid-column:span 6;height:320px}
  .tile.l{grid-column:span 12;height:320px} .tile.xl{grid-column:span 12;height:480px}
  @media (max-width:1100px){ .tile.s{grid-column:span 6} }
  @media (max-width:760px){ .tile.s,.tile.m,.tile.l,.tile.xl{grid-column:span 12;height:auto;min-height:220px;max-height:380px} }
  .tile.drag{opacity:.4}
  .tile.over{outline:2px dashed var(--acc);outline-offset:-2px}
  .tile.alert{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim)}
  .t-h{display:flex;align-items:center;gap:9px;height:38px;padding:0 8px 0 12px;border-bottom:1px solid var(--line);flex:none;cursor:grab;user-select:none;background:var(--surface)}
  .t-h:active{cursor:grabbing}
  .t-h > .ico{opacity:.7;width:16px;height:16px}
  .t-h .name{font:500 13px var(--sans);color:var(--ink)}
  .tile.alert .t-h > .ico{opacity:1;stroke:var(--acc)}
  .tile.alert .t-h .name{color:var(--acc)}
  .t-h .hb{margin-left:auto;display:flex;gap:2px}
  .t-h .hb button{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r2);color:var(--mut);transition:background var(--t),color var(--t)}
  .t-h .hb button:hover{color:var(--ink);background:var(--raise)}
  .t-h .hb .svcbtn.stop:hover{color:var(--bad);background:var(--bad-dim)}
  .t-b{flex:1;overflow:auto;min-height:0;padding:10px 12px;display:flex;flex-direction:column;scrollbar-width:thin}
  .t-b.nopad{padding:0;background:var(--term)}   /* the ground continues into the terminal — no seam */
  .empty{color:var(--mut);font-size:12.5px;padding:8px 0;line-height:1.5}
  .empty .cmd{font:11.5px var(--mono);color:var(--ink);background:var(--raise);border-radius:var(--r);padding:1px 7px}

  /* focus mode: one (or two) tiles fill the main area */
  body.focusmode .gridwrap{display:flex;min-height:0}
  body.focusmode .grid{flex:1;grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);padding:0;gap:0;height:100%;min-width:0;align-content:stretch}
  body.focusmode.split .grid{grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  body.focusmode .tile.focus{grid-column:auto;height:auto;min-height:0;border:0;border-radius:0;box-shadow:none;animation:fade var(--t)}
  @keyframes fade{from{opacity:0}}
  @media (max-width:720px){
    body.focusmode.split .grid{grid-template-columns:1fr}
    body.focusmode.split .tile.focus:nth-child(2){display:none}
  }

  /* agents */
  .agent{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .agent:first-child{border-top:none}
  .agent .adot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mut2)}
  .agent .adot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-dim)} .agent .adot.idle{background:var(--warn)}
  .agent .aid{font:500 11.5px var(--mono);flex:none}
  .agent .arole{font:10.5px var(--mono);color:var(--mut2);border:1px solid var(--line);border-radius:var(--r);padding:1px 6px;flex:none}
  .agent .adetail{color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .agent .awhen{font:10.5px var(--mono);color:var(--mut2);margin-left:auto;flex:none}
  .agent[data-agent]{cursor:pointer;margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:var(--r2);transition:background var(--t)}
  .agent[data-agent]:hover{background:var(--raise)}
  .aevt{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline;font-size:12.5px}
  .aevt:first-child{border-top:none}
  .aevt .ev{font:10.5px var(--mono);border-radius:var(--r);padding:1px 7px;flex:none;border:1px solid var(--line);color:var(--mut)}
  .aevt .ev.tool{color:var(--ok);border-color:transparent;background:var(--ok-dim)}
  .aevt .ev.prompt{color:var(--warn);border-color:transparent;background:var(--warn-dim)}
  .aevt .dt{min-width:0;flex:1;word-break:break-word;font:12px var(--mono)}
  .aevt time{font:10px var(--mono);color:var(--mut2);margin-left:auto;flex:none}
  .backbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:4px 10px;font-size:11.5px;color:var(--mut);display:inline-flex;gap:5px;align-items:center}
  .backbtn:hover{color:var(--ink);border-color:var(--line2)}

  /* cards: gates, questions, replies */
  .item{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--raise);margin-bottom:8px;animation:card-in 220ms cubic-bezier(.2,.7,.2,1)}
  @keyframes card-in{from{opacity:0;transform:translateY(6px)}}
  .item.gate,.item.ask{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim);background:var(--surface)}   /* the one place the accent lives */
  .item b.fn{display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--mono);color:var(--acc)}
  .item p{margin:6px 0 0;font-size:13px;white-space:pre-wrap;word-break:break-word}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r2);padding:7px 14px;font-weight:500;font-size:12.5px;transition:background var(--t),border-color var(--t)}
  .btn:hover{border-color:var(--mut2);background:var(--raise)}
  .btn.pri{background:var(--acc);border-color:transparent;color:var(--acc-ink);font-weight:600}
  .btn.pri:hover{filter:brightness(1.08)}
  .note-in{flex:1;min-width:140px;border:1px solid var(--line2);border-radius:var(--r2);padding:7px 10px;font:12.5px var(--sans);background:var(--bg);color:var(--ink);transition:border-color var(--t)}
  .note-in:focus{border-color:var(--acc);outline:none}
  .opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .opt{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r2);font-size:13px;cursor:pointer;transition:border-color var(--t),background var(--t)}
  .opt:hover{border-color:var(--mut2);background:var(--raise)}
  .opt:has(input:checked){border-color:var(--acc);background:var(--acc-dim)}
  .opt input{margin:0;accent-color:var(--acc);width:15px;height:15px}
  .reply-item{border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:var(--r);padding:12px 14px;background:var(--raise);margin-bottom:8px;position:relative;animation:card-in 220ms cubic-bezier(.2,.7,.2,1)}
  .reply-item .x,.d-h .x{position:absolute;top:8px;right:8px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r2);color:var(--mut2)}
  .reply-item .x:hover,.d-h .x:hover{color:var(--ink);background:var(--line)}
  .reply-item .x .ico,.d-h .x .ico{width:14px;height:14px}

  /* terminals */
  .term{background:var(--term);font:12px/1.6 var(--mono);color:var(--term-ink);flex:1;min-height:0;overflow:auto;padding:11px 14px;scrollbar-width:thin}
  .term .ln{white-space:pre-wrap;word-break:break-all}
  .term .ok{color:var(--ok)}
  .termf{border:0;width:100%;height:100%;display:block;background:var(--term)}
  .termnote{flex:none;padding:6px 12px;font:11px var(--mono);color:var(--mut);background:var(--surface);border-top:1px solid var(--line)}

  /* runs, activity, lists */
  .run,.act{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;align-items:center}
  .run:first-child,.act:first-child{border-top:none}
  .tag{min-width:56px;text-transform:lowercase}
  .tag.done{color:var(--ok);border-color:transparent;background:var(--ok-dim)}
  .tag.failed{color:var(--bad);border-color:transparent;background:var(--bad-dim)}
  .tag.working{color:var(--warn);border-color:transparent;background:var(--warn-dim)}
  .who{font-weight:500;flex:none;font-size:12.5px}
  .what{color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .when{font:10.5px var(--mono);color:var(--mut2);margin-left:auto;flex:none}
  .rowi{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
  .rowi:first-child{border-top:none}
  .shots{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:thin}
  .shots a{flex:none}
  .shots img{height:84px;border-radius:var(--r);border:1px solid var(--line);display:block;transition:border-color var(--t)}
  .shots img:hover{border-color:var(--acc)}
  .slice{padding:9px 0;border-top:1px solid var(--line)}
  .slice:first-child{border-top:none;padding-top:2px}
  .slice .sh{display:flex;gap:9px;align-items:baseline;margin-bottom:2px}
  .slice b{font-size:12.5px;font-weight:500}
  pre.mono{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font:11.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;margin:0 0 8px;color:var(--ink)}

  /* ---------- composer ---------- */
  .dock{grid-column:1/-1;display:flex;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface);flex:none;position:relative;z-index:6}
  .composer{flex:1;display:flex;align-items:flex-end;gap:6px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--bg);padding:4px 4px 4px 12px;transition:border-color var(--t),box-shadow var(--t)}
  .composer:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim)}
  .composer textarea{flex:1;resize:none;height:34px;max-height:140px;border:0;padding:8px 0;font:13px var(--sans);background:none;color:var(--ink);outline:none}
  .composer textarea::placeholder{color:var(--mut2)}
  .sendbtn{width:34px;height:34px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r2);background:var(--acc);color:var(--acc-ink);transition:filter var(--t),transform var(--t)}
  .sendbtn:hover{filter:brightness(1.08)} .sendbtn:active{transform:scale(.96)}
  .sendbtn .ico{width:17px;height:17px;stroke-width:2}

  /* ---------- stream drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity var(--t);z-index:8}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--surface);border-left:1px solid var(--line2);display:flex;flex-direction:column;z-index:9;
          transform:translateX(103%);transition:transform 220ms cubic-bezier(.2,.7,.2,1)}
  .drawer.open{transform:none}
  .d-h{display:flex;align-items:center;gap:9px;height:48px;padding:0 44px 0 16px;border-bottom:1px solid var(--line);flex:none;position:relative}
  .d-h .name{font:500 13px var(--sans);color:var(--ink)}
  .d-h .sub{color:var(--mut2);font-size:11.5px}
  .d-h .x{top:11px;right:10px}
  .d-scroll{flex:1;overflow-y:auto;min-height:0;padding:12px 16px;scrollbar-width:thin}
  .msg{display:flex;gap:9px;padding:6px 0;align-items:flex-start}
  .av{width:26px;height:26px;border-radius:var(--r2);background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--mut);font-size:12px}
  .av.you{background:var(--acc);color:var(--acc-ink);border-color:transparent}
  .m-b{min-width:0;flex:1}
  .m-h{font:10.5px var(--mono);color:var(--mut2);margin-bottom:2px}
  .m-h b{color:var(--mut);font-weight:500}
  .bub{background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:8px 12px;font-size:12.5px;word-break:break-word;white-space:pre-wrap}
  .bub.gate{border-color:var(--acc)}
  .bub.you{background:var(--raise);border-color:transparent}
  .dayrule{display:flex;align-items:center;gap:10px;color:var(--mut2);font:10.5px var(--mono);margin:8px 0}
  .dayrule::before,.dayrule::after{content:"";flex:1;height:1px;background:var(--line)}

  /* offline */
  .dead{display:none;margin:auto;text-align:center;padding:24px}
  body.offline .dead{display:block}
  body.offline .gridwrap .grid,body.offline .side{display:none}
  .dead h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .dead p{color:var(--mut)}
  .dead code{font:12px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:4px 10px}
  .offpill{display:none;font:500 11px var(--mono);color:var(--bad);border:1px solid var(--bad);border-radius:99px;padding:2px 10px}
  body.offline .offpill{display:inline-block}

  /* command palette */
  .cmdk{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30;padding-top:12vh}
  .cmdk.open{display:block}
  .cmdbox{width:min(560px,92vw);margin:0 auto;background:var(--surface);border:1px solid var(--line2);border-radius:8px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop var(--t)}
  .cmdbox input{width:100%;border:none;background:none;color:var(--ink);padding:16px 18px;font:15px var(--sans);border-bottom:1px solid var(--line);outline:none}
  .cmdbox input::placeholder{color:var(--mut2)}
  .cmdlist{max-height:52vh;overflow-y:auto;padding:6px;scrollbar-width:thin}
  .cmdrow{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:var(--r2);cursor:pointer;font-size:13.5px}
  .cmdrow .ico{opacity:.6}
  .cmdrow.sel{background:var(--acc-dim);color:var(--ink)}
  .cmdrow.sel .ico{opacity:1;stroke:var(--acc)}
  .cmdrow .grp{font:10.5px var(--mono);color:var(--mut2);margin-left:auto}
  .cmdhint{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font:10.5px var(--mono);color:var(--mut2)}

  /* ---------- small screens: sidebar becomes a horizontal rail above the main area (last, so it wins) ---------- */
  @media (max-width:720px){
    body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
    .bar{height:auto;min-height:48px;flex-wrap:wrap;row-gap:6px;padding:8px 12px}
    .acct,.state,.usage,.svc{display:none}
    .hbtn span{display:none} .hbtn{width:32px;padding:0;justify-content:center}
    .side{grid-row:2;grid-column:1;width:auto!important;height:52px}
    .sd-inner{width:100%!important;flex-direction:row;overflow:auto hidden;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;gap:4px;align-items:center;box-shadow:none!important}
    .sd-g,.sd-i .lb,.sd-i .pinb,.sd-foot{display:none}
    .sd-i{width:36px;height:36px;padding:0;justify-content:center}
    .sd-i.on::before{display:none}
    .sd-i i{position:absolute;top:0;right:0;padding:1px 4px;font-size:9.5px}
    .gridwrap{grid-row:3;grid-column:1}
    .dock{grid-row:4;grid-column:1}
    body.focusmode .tile.focus{max-height:none;height:auto}
    [data-tip]::after{display:none}
  }
</style>
</head>
<body>

<header class="bar">
  <span class="pdot" id="pdot"></span>
  <span class="proj" id="proj">mission control</span>
  <span class="acct" id="acct" title="Claude account this machine's sessions run on"></span>
  <span class="usage" id="usage"></span>
  <span class="state" id="stateTxt"></span>
  <span class="offpill">reconnecting</span>
  <span class="spacer"></span>
  <span class="svc" id="svcDots" data-tip="Windows running in the machine"></span>
  <button class="hbtn" id="newSess" data-tip="Start a Claude session inside the machine"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Session</span></button>
  <div class="fleetmenu">
    <button class="hbtn" id="fleetBtn" data-tip="Every machine on this host"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span id="fleetName">Fleet</span></button>
    <div class="fleetpop" id="fleetPop"></div>
  </div>
  <button class="hbtn icon" id="themeBtn" data-tip="Theme: auto" aria-label="Switch theme"></button>
  <button class="hbtn" id="streamBtn" data-tip="Event stream, gates and replies (⌘K for commands)"><svg class="ico" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Stream</span><span class="nbadge" id="unread"></span></button>
</header>

<nav class="side" id="side" aria-label="Navigation"><div class="sd-inner" id="sideInner"></div></nav>

<div class="gridwrap">
  <div class="grid" id="grid"></div>
  <div class="dead">
    <h1>Machine offline</h1>
    <p>Mission control lost its server. From the project root:</p>
    <p><code>bash &lt;plugin&gt;/scripts/orchestrator.sh</code></p>
    <p id="lastseen" style="font-size:12px;color:var(--mut2)"></p>
  </div>
</div>

<div class="dock">
  <div class="composer">
    <textarea id="ta" rows="1" placeholder="Tell the machine anything — it goes to the orchestrator…"></textarea>
    <button class="sendbtn" id="sendBtn" data-tip="Send to the orchestrator (Enter)" aria-label="Send"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</div>

<div class="cmdk" id="cmdk">
  <div class="cmdbox">
    <input id="cmdInput" placeholder="Search tiles, actions…  (open a panel, approve, switch theme)" autocomplete="off">
    <div class="cmdlist" id="cmdList"></div>
    <div class="cmdhint"><span>↑↓ navigate</span><span>↵ run</span><span>esc close</span><span style="margin-left:auto">⌘K</span></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Event stream">
  <div class="d-h">
    <svg class="ico" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span id="d-title" style="display:flex;align-items:center;gap:6px"><span class="name">Stream</span><span class="sub">the story, oldest → newest</span></span>
    <button class="x" id="drawerX" data-tip="Close (Esc)" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="d-scroll" id="dscroll"></div>
  <div class="dock" style="border-top:1px solid var(--line)">
    <div class="composer">
      <textarea id="ta2" rows="1" placeholder="Reply in the stream…"></textarea>
      <button class="sendbtn" id="sendBtn2" data-tip="Send (Enter)" aria-label="Send"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</aside>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rel = iso => { if(!iso) return ""; const m=(Date.now()-new Date(iso))/60000;
  return m<1?"now":m<60?Math.round(m)+"m":m<1440?Math.round(m/60)+"h":Math.round(m/1440)+"d"; };
const ICON = {
  gate:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  term:'<svg class="ico" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>',
  proof:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>',
  runs:'<svg class="ico" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  activity:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  board:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>',
  git:'<svg class="ico" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M6 9v6M18 9a9 9 0 0 1-9 9"/></svg>',
  reply:'<svg class="ico" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="m8 10 3 3 5-5"/></svg>',
  doc:'<svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  hand:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 12v8h16v-8M12 2v14m0 0 4-4m-4 4-4-4"/></svg>',
  plus:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  left:'<svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/><path d="M4 4v16"/></svg>',
  right:'<svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/><path d="M4 4v16"/></svg>',
  restart:'<svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>',
  stop:'<svg class="ico" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>',
  max:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"/></svg>',
  min:'<svg class="ico" viewBox="0 0 24 24"><path d="M9 4v5H4M15 20v-5h5M15 4v5h5M9 20v-5H4"/></svg>',
  size:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 14v6h6M20 10V4h-6M20 4l-7 7M4 20l7-7"/></svg>',
  close:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  sun:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg class="ico" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>',
  auto:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>',
};

/* ---------------- state + tiles ---------------- */
let S = null, project = null, openLogAtBottom = {};
const store = { get k(){ return "dm2-" + (project||"x"); },
  load(){ try{ return JSON.parse(localStorage.getItem(this.k))||null }catch{ return null } },
  save(v){ try{ localStorage.setItem(this.k, JSON.stringify(v)) }catch{} } };
let layout = null; // {open:[], sizes:{}, order:[]}
const DEFAULT_OPEN = ["gates","agents","proof","runs"];

function tileDefs(s){
  const d = {};
  d.gates = { name:"Waiting on you", icon:ICON.gate, count: asks(s).length,
    alert: asks(s).length>0 || (s.replies||[]).length>0,
    body(){ let h = "";
      // ask-* cards carry a JSON body (question + options) written by the ask.sh hook; gates are plain text
      const parsed = asks(s).map(i => { let j = null; if (i.name.startsWith("ask-")) { try { j = JSON.parse(i.body); } catch {} } return { ...i, j }; });
      h += parsed.filter(i => i.j).map(i => `<div class="item ask" data-ask="${esc(i.name)}">
        <b class="fn">${i.j.kind==="permission"?"permission":"question"} · ${esc(i.j.title||"")}</b>
        ${(i.j.questions||[]).map((q,qi) => `<p>${esc(q.question)}</p><div class="opts">
          ${(q.options||[]).map(o => `<label class="opt"><input type="${q.multi?"checkbox":"radio"}" name="q${qi}-${esc(i.name)}" value="${esc(o)}"> ${esc(o)}</label>`).join("")}
        </div>`).join("")}
        <div class="acts"><input class="note-in" placeholder="or type an answer…" data-ask-text="${esc(i.name)}">
        <button class="btn pri" data-ask-send="${esc(i.name)}">Answer</button></div></div>`).join("");
      const a = parsed.filter(i => !i.j);
      h += a.length ? a.map(i => `<div class="item gate"><b class="fn">${esc(i.name)}</b><p>${esc(i.body)}</p>
        <div class="acts"><button class="btn pri" data-act="approve" data-re="${esc(i.name)}">Approve</button>
        <button class="btn" data-act="reject" data-re="${esc(i.name)}">Reject</button>
        <input class="note-in" placeholder="note…" data-note-for="${esc(i.name)}"></div></div>`).join("")
        : (parsed.length ? "" : `<div class="empty">Nothing needs you — gates and questions land here and ping your phone.</div>`);
      h += (s.replies||[]).map(r => `<div class="reply-item"><button class="x" data-dismiss="${esc(r.name)}" data-tip="Dismiss" aria-label="Dismiss">${ICON.close}</button>
        <b class="fn">machine replied</b><p>${esc(r.body)}</p></div>`).join("");
      const out = outbound(s);
      h += out.map(i => `<div style="font:11px var(--mono);color:var(--mut2);padding:3px 0">↗ ${esc(i.name)} — awaiting pickup</div>`).join("");
      return h; } };
  (s.tmux||[]).forEach(w => { d["term:"+w.window] = { name:"terminal · "+w.window, icon:ICON.term, nopad:true,
      body(){ return s.ttyd_port
        ? `<iframe class="termf" data-termf="${esc(w.window)}" src="http://127.0.0.1:${s.ttyd_port}/?arg=${encodeURIComponent(w.window)}" title="terminal ${esc(w.window)}" allow="clipboard-read; clipboard-write"></iframe>`
        : `<div class="term" data-term="${esc(w.window)}"><div class="ln">loading…</div></div>
           <div class="termnote">read-only snapshot — <span class="cmd">brew install ttyd</span>, then restart the machine, for a live terminal</div>`; } }; });
  d.proof = { name:"Proof", icon:ICON.proof, count:(s.proof||[]).length,
    body(){ return (s.proof||[]).length ? s.proof.map(p => `<div class="slice">
        <div class="sh"><b>${esc(p.slice)}</b><span class="when">${esc(p.mtime)}</span></div>
        <div class="shots">${p.files.filter(f=>/\.(png|jpe?g|gif)$/i.test(f.name)).map(f =>
          `<a href="/proof/${encodeURIComponent(p.slice)}/${encodeURIComponent(f.name)}" target="_blank" rel="noopener">
             <img loading="lazy" src="/proof/${encodeURIComponent(p.slice)}/${encodeURIComponent(f.name)}" alt="${esc(f.name)}"></a>`).join("")
          || '<span style="color:var(--mut2);font-size:12px">no images</span>'}</div></div>`).join("")
      : `<div class="empty">No proof yet — and no proof means nothing is done.</div>`; } };
  d.runs = { name:"Agent runs", icon:ICON.runs, count:(s.runs||[]).length,
    body(){ return (s.runs||[]).length ? s.runs.slice(0,14).map(r => `<div class="run">
        <span class="tag ${esc(r.status)}">${esc(r.status||"·")}</span>
        <span class="who">${esc((r.agent||"").replace("dm-",""))}</span>
        <span class="what">${esc(r.slice||"")}${r.note?" — "+esc(r.note):""}</span>
        <span class="when">${rel(r.ts)}</span></div>`).join("")
      : `<div class="empty">No agent has run yet — give the machine an intent with <span class="cmd">/dm</span></div>`; } };
  d.activity = { name:"Session activity", icon:ICON.activity, count:(s.activity||[]).length||null,
    body(){ return (s.activity||[]).length ? s.activity.map(a => `<div class="act">
        <span class="tag ${a.event==="tool"?"done":a.event==="prompt"?"working":""}">${esc(a.event)}</span>
        <span class="what">${esc(a.detail||"")}</span><span class="when">${rel(a.ts)}</span></div>`).join("")
      : `<div class="empty">Lights up once the plugin hooks are installed:<br><span class="cmd">claude plugin install delivery-machine@dm-marketplace</span></div>`; } };
  d.agents = { name:"Agents & sessions", icon:ICON.runs,
    count:(s.agents||[]).filter(a=>a.alive).length||null,
    alert:(s.agents||[]).some(a=>a.alive),
    body(){ return (s.agents||[]).length ? s.agents.map(a => {
        const st = a.alive?"on":a.idle?"idle":"off";
        return `<div class="agent" data-agent="${esc(a.sid)}" title="click for this agent's full history"><span class="adot ${st}"></span>
          <span class="aid">${esc(a.sid)}</span>
          <span class="arole">${esc(a.role||"session")}</span>
          <span class="adetail">${esc(a.detail||a.event||"")}</span>
          <span class="awhen">${a.alive?"live":rel(a.ts)}</span></div>`; }).join("")
      : `<div class="empty">No live sessions tracked yet — each Claude session in this project appears here once the plugin hooks fire. Parallel builders show as their own rows.</div>`; } };
  d.board = { name:"Board", icon:ICON.board, count:(s.specs||[]).length+(s.notes||[]).length||null,
    body(){ const rows = [...(s.specs||[]).map(f=>[f.name,f.mtime,""]), ...(s.notes||[]).map(f=>[f.name,f.mtime,"note"])];
      return rows.length ? rows.map(([n,t,k]) => `<div class="rowi"><span>${k?"▫ ":""}${esc(n)}</span><span class="when">${esc(t)}</span></div>`).join("")
      : `<div class="empty">No specs yet — the architect writes to <span class="cmd">.planning/specs/</span></div>`; } };
  d.git = { name:"Branches", icon:ICON.git,
    body(){ return (s.git.branches ? `<pre class="mono">${esc(s.git.branches)}</pre>` : `<div style="color:var(--mut);font-size:12.5px;margin-bottom:8px">Nothing awaiting merge.</div>`) +
      `<pre class="mono" style="color:var(--mut)">on ${esc(s.git.branch)||"—"} · ${esc(s.git.status)||"clean"}\n${esc(s.git.log)}</pre>`; } };
  d.decisions = { name:"Decisions", icon:ICON.doc,
    body(){ return s.decisions ? `<pre class="mono">${esc(s.decisions)}</pre>` : `<div class="empty">None recorded yet.</div>`; } };
  d.handoff = { name:"Last handoff", icon:ICON.hand,
    body(){ return s.handoff ? `<pre class="mono">${esc(s.handoff)}</pre>` : `<div class="empty">No handoff yet — written automatically before compaction.</div>`; } };
  return d;
}
const asks = s => (s.inbox||[]).filter(i => !/^(reply|note)-/.test(i.name));
const outbound = s => (s.inbox||[]).filter(i => /^(reply|note)-/.test(i.name));

/* ---------------- grid rendering ---------------- */
const bodyHash = {};
function ensureLayout(defs){
  if (!layout) layout = store.load() || { open:[...DEFAULT_OPEN], sizes:{}, order:[] };
  // auto-open first terminal ever seen
  const terms = Object.keys(defs).filter(k=>k.startsWith("term:"));
  if (!layout.seenTerm && terms.length){ layout.open.splice(1,0,terms[0]); layout.seenTerm = true; store.save(layout); }
  layout.open = layout.open.filter(k => defs[k]);
  const order = layout.order.filter(k => layout.open.includes(k));
  layout.open.forEach(k => { if(!order.includes(k)) order.push(k); });
  layout.order = order;
  layout.focus = (layout.focus||[]).filter(k => defs[k]);   // 0–2 keys: focus / split
}
function drawSkeleton(defs){
  // rebuilding the grid destroys every iframe (ttyd reconnects, xterm flashes its size) —
  // only do it when the tile set, order, or sizes actually changed; bodies/alerts/counts refresh in fillBodies
  const sig = JSON.stringify([layout.order, layout.sizes, layout.focus||[]]);
  if (sig === drawSkeleton.sig && $("grid").children.length) return;
  drawSkeleton.sig = sig;
  const keys = layout.focus.length ? layout.focus : layout.order;
  document.body.classList.toggle("focusmode", layout.focus.length > 0);
  document.body.classList.toggle("split", layout.focus.length === 2);
  $("grid").innerHTML = keys.map(k => {
    const t = defs[k]; const size = layout.sizes[k] || (k.startsWith("term:")?"xl":"m");
    return `<div class="tile ${size} ${t.alert?"alert":""} ${layout.focus.includes(k)?"focus":""}" data-k="${esc(k)}" draggable="true">
      <div class="t-h">${t.icon}<span class="name">${esc(t.name)}</span>
        ${t.count!=null?`<span class="cnt">${t.count}</span>`:""}
        <span class="hb">
          ${k.startsWith("term:") && !/^term:claude/.test(k)?`
            <button class="svcbtn" data-svc="restart" data-w="${esc(k.slice(5))}" data-tip="Restart this service" aria-label="Restart">${ICON.restart}</button>
            <button class="svcbtn stop" data-svc="stop" data-w="${esc(k.slice(5))}" data-tip="Stop this service (Ctrl-C)" aria-label="Stop">${ICON.stop}</button>`:""}
          <button data-focus="${esc(k)}" data-tip="${layout.focus.includes(k)?"Back to overview (Esc)":"Open full width · shift-click to split"}" aria-label="Focus">${layout.focus.includes(k)?ICON.min:ICON.max}</button>
          ${layout.focus.length?"":`<button data-size="${esc(k)}" data-tip="Cycle size" aria-label="Resize">${ICON.size}</button>`}
          <button data-close="${esc(k)}" data-tip="Remove from overview" aria-label="Close">${ICON.close}</button></span></div>
      <div class="t-b ${t.nopad?"nopad":""}" id="b-${cssId(k)}"></div></div>`;
  }).join("");
  Object.keys(bodyHash).forEach(k=>delete bodyHash[k]);
  wireGrid(defs);
}
const cssId = k => k.replace(/[^a-z0-9]/gi,"_");
function fillBodies(defs){
  layout.order.forEach(k => {
    const el = $("b-"+cssId(k)); if (!el) return;
    const html = defs[k].body();
    if (bodyHash[k] !== html){ bodyHash[k] = html; el.innerHTML = html; wireBody(el); }
    // alert ring + count refresh without full rebuild
    const tile = el.closest(".tile");
    tile.classList.toggle("alert", !!defs[k].alert);
    const cnt = tile.querySelector(".cnt"); if (cnt && defs[k].count!=null) cnt.textContent = defs[k].count;
  });
  refreshTerms();
}
/* sidebar: Overview · Sessions · Services · Machine · System. Click opens (focus), shift-click splits,
   the ⊞/⊟ pin adds/removes a panel from the Overview grid. */
function drawSide(defs){
  $("side").classList.toggle("pin", !!layout.side);
  const isTerm = k => k.startsWith("term:"), win = k => k.slice(5);
  const sys = new Set(["control","mission","ttyd","watch"]);
  const keys = Object.keys(defs);
  const sessions = keys.filter(k => /^term:claude/.test(k));
  const services = keys.filter(k => isTerm(k) && !/^term:claude/.test(k) && !sys.has(win(k)));
  const system   = keys.filter(k => isTerm(k) && sys.has(win(k)));
  const panels   = keys.filter(k => !isTerm(k));
  const cmdOf = w => ((S.tmux||[]).find(x => x.window===w) || {}).cmd || "";
  const dot = k => `<span class="dot ${/^(zsh|bash|sh|fish)$/.test(cmdOf(win(k)))?"off":""}" title="${esc(cmdOf(win(k))||"idle shell")}"></span>`;
  const hr5 = w => { const u = (S.usage||[]).find(x => x.window===w); return u && u.hr5!=null ? u.hr5+"%" : null; };
  const item = (k, label, extra="", cnt) => { const t = defs[k], pinned = layout.open.includes(k), c = cnt ?? t.count;
    return `<div class="sd-i ${layout.focus.includes(k)?"on":""} ${t.alert?"alert":""}" data-nav="${esc(k)}" role="button" tabindex="0" title="${esc(label)} — open · shift-click to split">
      ${t.icon}${extra}<span class="lb">${esc(label)}</span>${c!=null?`<i>${esc(c)}</i>`:""}
      <button class="pinb ${pinned?"on":""}" data-pin="${esc(k)}" data-tip="${pinned?"Remove from Overview":"Show in Overview"}" aria-label="Pin to overview">${pinned?ICON.close:ICON.plus}</button></div>`; };
  const nav = (id, label, icon, title) => `<div class="sd-i ${id==="__overview"&&!layout.focus.length?"on":""}" data-nav="${id}" role="button" tabindex="0" title="${esc(title)}">${icon}<span class="lb">${esc(label)}</span></div>`;
  let h = nav("__overview", "Overview", ICON.board, "Overview — every panel you pinned (esc)");
  h += `<div class="sd-g">Sessions</div>` + sessions.map(k => item(k, win(k), dot(k), hr5(win(k)))).join("")
     + nav("__new", "New session", ICON.plus, "Start a Claude session inside the machine");
  h += `<div class="sd-g">Services</div>` + (services.map(k => item(k, win(k), dot(k))).join("") || `<div class="sd-g" style="padding-top:2px">none</div>`);
  h += `<div class="sd-g">Machine</div>` + panels.map(k => item(k, defs[k].name)).join("");
  h += `<div class="sd-g">System</div>` + system.map(k => item(k, win(k), dot(k))).join("");
  h += `<div class="sd-foot">` + nav("__pin", layout.side ? "Unpin sidebar" : "Keep sidebar open", layout.side ? ICON.left : ICON.right, "Pin the sidebar open (it expands on hover otherwise)") + `</div>`;
  if (drawSide.h === h) return; drawSide.h = h;   // no churn under the pointer on every tick
  $("sideInner").innerHTML = h;
  const go = (el, e) => {
    if (e.target.closest("[data-pin]")) return;
    const k = el.dataset.nav;
    if (k === "__overview"){ layout.focus = []; store.save(layout); rebuild(); return; }
    if (k === "__new") return $("newSess").click();
    if (k === "__pin"){ layout.side = !layout.side; store.save(layout); rebuild(); return; }
    toggleFocus(k, e.shiftKey);
  };
  $("sideInner").querySelectorAll("[data-nav]").forEach(el => { el.onclick = e => go(el, e);
    el.onkeydown = e => { if (e.key==="Enter" || e.key===" "){ e.preventDefault(); go(el, e); } }; });
  $("sideInner").querySelectorAll("[data-pin]").forEach(b => b.onclick = e => { e.stopPropagation();
    const k = b.dataset.pin;
    layout.open.includes(k) ? (layout.open = layout.open.filter(x=>x!==k), layout.order = layout.order.filter(x=>x!==k))
                            : (layout.open.push(k), layout.order.push(k));
    store.save(layout); rebuild(); });
}
function wireGrid(defs){
  // size cycle + close
  $("grid").querySelectorAll("[data-size]").forEach(b => b.onclick = e => { e.stopPropagation();
    const k = b.dataset.size, seq = ["s","m","l","xl"];
    layout.sizes[k] = seq[(seq.indexOf(layout.sizes[k]||"m")+1)%seq.length];
    store.save(layout); rebuild(); });
  $("grid").querySelectorAll("[data-close]").forEach(b => b.onclick = e => { e.stopPropagation();
    const k = b.dataset.close;
    layout.open = layout.open.filter(x=>x!==k); layout.order = layout.order.filter(x=>x!==k);
    store.save(layout); rebuild(); });
  $("grid").querySelectorAll("[data-focus]").forEach(b => b.onclick = e => { e.stopPropagation();
    const k = b.dataset.focus;
    if (layout.focus.includes(k)){ layout.focus = layout.focus.filter(x=>x!==k); store.save(layout); rebuild(); }   // ⤡ leaves this pane
    else toggleFocus(k, e.shiftKey); });
  $("grid").querySelectorAll("[data-svc]").forEach(b => b.onclick = async e => { e.stopPropagation();
    const w = b.dataset.w, act = b.dataset.svc; b.disabled = true;
    try { await fetch("/api/service", { method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ window:w, action:act }) }); } catch {}
    setTimeout(refreshTerms, 700); setTimeout(()=>{b.disabled=false;}, 900); });
  // drag reorder
  let dragK = null;
  $("grid").querySelectorAll(".tile").forEach(tile => {
    tile.addEventListener("dragstart", e => { dragK = tile.dataset.k; tile.classList.add("drag");
      e.dataTransfer.effectAllowed = "move"; });
    tile.addEventListener("dragend", () => { tile.classList.remove("drag");
      $("grid").querySelectorAll(".tile").forEach(t=>t.classList.remove("over")); });
    tile.addEventListener("dragover", e => { e.preventDefault(); if (tile.dataset.k!==dragK) tile.classList.add("over"); });
    tile.addEventListener("dragleave", () => tile.classList.remove("over"));
    tile.addEventListener("drop", e => { e.preventDefault(); tile.classList.remove("over");
      const to = tile.dataset.k; if (!dragK || dragK===to) return;
      const o = layout.order; o.splice(o.indexOf(dragK),1); o.splice(o.indexOf(to),0,dragK);
      store.save(layout); rebuild(); });
  });
}
function wireBody(el){
  el.querySelectorAll("[data-agent]").forEach(r => r.onclick = () => focusAgent(r.dataset.agent));
  el.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const re = b.dataset.re, note = el.querySelector(`[data-note-for="${CSS.escape(re)}"]`)?.value || "";
    b.disabled = true;
    await post("/api/inbox", { kind:"reply", re, text: b.dataset.act.toUpperCase()+(note?": "+note:"") });
  });
  el.querySelectorAll("[data-dismiss]").forEach(b => b.onclick = async () => {
    b.disabled = true; await post("/api/replies/dismiss", { name: b.dataset.dismiss });
  });
  // answer a question/permission card: picked options + free text → reply-*.txt, which ask.sh is polling for
  el.querySelectorAll("[data-ask-send]").forEach(b => b.onclick = async () => {
    const name = b.dataset.askSend, card = el.querySelector(`[data-ask="${CSS.escape(name)}"]`);
    const picked = [...card.querySelectorAll("input:checked")].map(i => i.value);
    const typed = card.querySelector("[data-ask-text]").value.trim();
    const text = [...picked, typed].filter(Boolean).join(", "); if (!text) return;
    b.disabled = true; await post("/api/inbox", { kind:"reply", re:name, text });
  });
}
function rebuild(){ if (!S) return; const defs = tileDefs(S); ensureLayout(defs); drawSkeleton(defs); fillBodies(defs); drawSide(defs); }

/* terminals: live poll */
async function refreshTerms(){
  for (const t of document.querySelectorAll("[data-term]")) {
    const w = t.dataset.term;
    try {
      const txt = await (await fetch("/api/logs?w="+encodeURIComponent(w))).text();
      const atBottom = t.scrollHeight - t.scrollTop - t.clientHeight < 40;
      const html = txt.split("\n").map(l =>
        `<div class="ln ${/(200|201|✓|listening)/.test(l)?"ok":""}">${esc(l)}</div>`).join("");
      if (t.dataset.h !== String(html.length)) { t.dataset.h = String(html.length); t.innerHTML = html; }
      if (atBottom || !openLogAtBottom[w]) { t.scrollTop = t.scrollHeight; openLogAtBottom[w] = true; }
    } catch {}
  }
}
setInterval(refreshTerms, 2600);

/* ---------------- stream drawer ---------------- */
function streamItems(s){
  const items = [];
  (s.activity||[]).slice().reverse().forEach(a => items.push({ts:a.ts, who:a.event==="prompt"?"you":"session", icon:a.event==="prompt"?"🙋":"", text:a.detail||a.event, cls:a.event==="prompt"?"you":""}));
  (s.runs||[]).slice().reverse().forEach(r => items.push({ts:r.ts, who:(r.agent||"machine").replace("dm-",""), text:`${r.slice||""} — ${r.status}${r.note?" · "+r.note:""}`}));
  (s.replies||[]).forEach(r => items.push({ts:null, tsRaw:r.mtime, who:"machine", text:r.body, cls:""}));
  asks(s).forEach(i => items.push({ts:null, tsRaw:i.mtime, who:"gate", text:i.name+"\n"+i.body, cls:"gate"}));
  items.sort((a,b) => String(a.ts||a.tsRaw||"").localeCompare(String(b.ts||b.tsRaw||"")));
  return items;
}
let lastStreamCount = 0;
function drawStream(s){
  const items = streamItems(s);
  const el = $("dscroll");
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  el.innerHTML = `<div class="dayrule">the story so far</div>` + (items.length ? items.map(i => `
    <div class="msg"><div class="av ${i.cls==="you"?"you":""}">${i.who==="gate"?"⚠":i.cls==="you"?"↑":"·"}</div>
      <div class="m-b"><div class="m-h"><b>${esc(i.who)}</b> ${i.ts?"· "+rel(i.ts):""}</div>
      <div class="bub ${esc(i.cls||"")}">${esc(i.text)}</div></div></div>`).join("")
    : `<div class="empty">Quiet so far. Events, gates, and replies land here as they happen.</div>`);
  if (atBottom) el.scrollTop = el.scrollHeight;
  // unread badge
  let seen = 0; try { seen = +localStorage.getItem("dm2-seen-"+project) || 0; } catch {}
  const n = Math.max(0, items.length - seen);
  $("unread").textContent = $("drawer").classList.contains("open") ? "" : (n || "");
  if ($("drawer").classList.contains("open")) { try { localStorage.setItem("dm2-seen-"+project, items.length); } catch {} }
  lastStreamCount = items.length;
}
let focusedSid = null;
function toggleDrawer(open){
  const d = $("drawer"), o = open ?? !d.classList.contains("open");
  d.classList.toggle("open", o); $("scrim").classList.toggle("open", o);
  if (o && S){ if (!focusedSid){ try { localStorage.setItem("dm2-seen-"+project, lastStreamCount); } catch {} drawStream(S); } $("ta2").focus(); }
  if (!o){ focusedSid = null; }
}
async function focusAgent(sid){
  focusedSid = sid;
  toggleDrawer(true);
  $("d-title").innerHTML = `<button class="backbtn" id="backBtn">← stream</button> <span class="name" style="margin-left:8px">agent ${esc(sid)}</span>`;
  $("backBtn").onclick = () => { focusedSid = null; $("d-title").innerHTML = `<span class="name">Stream</span><span class="sub">the story, oldest → newest</span>`; drawStream(S); };
  await renderAgentHistory(sid);
}
async function renderAgentHistory(sid){
  const el = $("dscroll");
  el.innerHTML = `<div class="dayrule">loading agent ${esc(sid)}…</div>`;
  let rows = [];
  try { rows = await (await fetch("/api/activity?sid=" + encodeURIComponent(sid))).json(); } catch {}
  const a = (S.agents||[]).find(x => x.sid === sid);
  const head = a ? `<div class="dayrule">${a.alive?"● live":a.idle?"○ idle":"○ ended"} · ${esc(a.role||"session")} · ${esc(a.cwd||"")}</div>` : "";
  el.innerHTML = head + (rows.length ? rows.map(r => `<div class="aevt">
      <span class="ev ${esc(r.event)}">${esc(r.event)}</span>
      <span class="dt">${esc(r.detail || "—")}</span>
      <time>${rel(r.ts)}</time></div>`).join("")
    : `<div class="empty">No recorded events for this agent yet.</div>`);
}
$("streamBtn").onclick = () => toggleDrawer();
$("drawerX").onclick = () => toggleDrawer(false);
$("scrim").onclick = () => toggleDrawer(false);
addEventListener("keydown", e => { if (e.key!=="Escape") return;
  if ($("drawer").classList.contains("open")) return toggleDrawer(false);
  if (layout && layout.focus.length){ layout.focus = []; store.save(layout); rebuild(); } });
function toggleFocus(k, add){
  // nav semantics: show k. shift adds it as the second pane; showing an already-shown pane is a no-op
  const f = layout.focus;
  if (add && f.length === 1 && f[0] !== k) layout.focus = [f[0], k];
  else if (!(f.length === 1 && f[0] === k)) layout.focus = [k];
  if (!layout.open.includes(k)){ layout.open.push(k); layout.order.push(k); }
  store.save(layout); rebuild();
}

/* ---------------- composer ---------------- */
async function post(url, payload){
  try { await fetch(url, { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(payload) }); }
  finally { refresh(); }
}
function wireComposer(ta, btn){
  const send = async () => { const t = $(ta).value.trim(); if (!t) return;
    $(ta).value = ""; await post("/api/inbox", { kind:"note", text:t }); toggleDrawer(true); };
  $(btn).onclick = send;
  $(ta).addEventListener("keydown", e => { if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
}
wireComposer("ta","sendBtn"); wireComposer("ta2","sendBtn2");
$("newSess").onclick = async () => { $("newSess").disabled = true;
  try { const r = await (await fetch("/api/session", {method:"POST"})).json();
    if (r.ok){ layout.open.push("term:"+r.window); layout.order.push("term:"+r.window); store.save(layout); }
  } finally { $("newSess").disabled = false; refresh(); } };

/* ---------------- presence + theme + fleet ---------------- */
const THEMES = ["auto","light","dark"];
let theme = "auto"; try { theme = localStorage.getItem("dm2-theme")||"auto"; } catch {}
function applyTheme(){
  // base stylesheet IS the dark skin; light is the [data-theme=light] override
  const wantLight = theme==="light" || (theme==="auto" && !matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.toggleAttribute("data-theme", false);
  if (wantLight) document.documentElement.setAttribute("data-theme","light");
  else document.documentElement.removeAttribute("data-theme");
  $("themeBtn").innerHTML = ICON[theme==="auto" ? "auto" : theme==="light" ? "sun" : "moon"];
  $("themeBtn").dataset.tip = "Theme: " + theme + " — click to cycle";
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (theme==="auto") applyTheme(); });
$("themeBtn").onclick = () => { theme = THEMES[(THEMES.indexOf(theme)+1)%3];
  try{ localStorage.setItem("dm2-theme",theme); }catch{}; applyTheme(); };
applyTheme();
$("fleetBtn").onclick = e => { e.stopPropagation(); $("fleetPop").classList.toggle("open"); };
addEventListener("click", e => { if (!e.target.closest(".fleetmenu")) $("fleetPop").classList.remove("open"); });

/* ---------------- main loop ---------------- */
function render(s){
  const ae = document.activeElement;
  if (ae && (ae.tagName==="TEXTAREA" || (ae.tagName==="INPUT" && ae.type==="text"))) return; // never clobber typing
  S = s; project = s.project;
  document.body.classList.remove("offline"); $("pdot").classList.remove("down");
  $("proj").textContent = s.project;
  $("acct").textContent = s.account ? (s.account.email || s.account.dir) +
    (s.account.org && s.account.email && !s.account.org.includes(s.account.email) ? " · " + s.account.org : "") : "";
  $("usage").innerHTML = (s.usage||[]).map(u => {
    const pct = v => v==null ? "—" : v+"%";
    const cls = u.hr5>=95 ? "bad" : u.hr5>=80 ? "warn" : "";   // the 5h window is what stalls a run
    return `<span class="pill" data-tip="Usage of this session's account: 5-hour window ${pct(u.hr5)}, 7-day ${pct(u.day7)}">${esc(u.window)} · ctx ${pct(u.context)} · 5h <span class="${cls}">${pct(u.hr5)}</span>${u.cost!=null?" · $"+u.cost.toFixed(2):""}</span>`;
  }).join("");
  const working = (s.runs||[])[0];
  $("stateTxt").textContent = asks(s).length ? asks(s).length+" waiting on you" :
    working && working.status==="working" ? working.agent+" working" : "idle · "+new Date(s.now).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  $("svcDots").innerHTML = (s.tmux||[]).map(w=>`<i title="${esc(w.window)}"></i>`).join("") || '<i class="b" title="not running"></i>';
  $("fleetPop").innerHTML = (s.fleet||[]).map(f =>
    `<a href="http://localhost:${f.port}" class="${f.project===s.project?"me":""}">${esc(f.project)} <span style="float:right;color:var(--mut2)">:${f.port}</span></a>`).join("");
  $("fleetName").textContent = "fleet · " + (s.fleet||[]).length;
  rebuild();
  if (focusedSid && $("drawer").classList.contains("open")) renderAgentHistory(focusedSid);
  else drawStream(s);
  try { localStorage.setItem("dm2-lastseen", s.now); } catch {}
}
function offline(){ document.body.classList.add("offline"); $("pdot").classList.add("down");
  let t=null; try{ t = localStorage.getItem("dm2-lastseen"); }catch{}
  if (t) $("lastseen").textContent = "last seen "+new Date(t).toLocaleString(); }
async function refresh(){ try { render(await (await fetch("/api/state")).json()); } catch { offline(); } }
/* ---------------- command palette ---------------- */
function cmdActions(){
  const defs = S ? tileDefs(S) : {};
  const acts = [];
  Object.entries(defs).forEach(([k,t]) => {
    const open = layout && layout.open.includes(k);
    acts.push({ label:(open?"Show":"Open")+" "+t.name, grp:"tile", icon:t.icon, run(){
      if (!open){ layout.open.push(k); layout.order.push(k); store.save(layout); rebuild(); }
      const el = $("b-"+cssId(k)); if (el) el.closest(".tile").scrollIntoView({behavior:"smooth",block:"center"});
    }});
    acts.push({ label:"Focus "+t.name, grp:"focus", icon:t.icon, run(){ toggleFocus(k); } });
  });
  acts.push({ label:"Overview", grp:"focus", icon:ICON.board, run(){ layout.focus=[]; store.save(layout); rebuild(); } });
  acts.push({ label:(layout && layout.side ? "Unpin" : "Pin")+" sidebar", grp:"action", icon:ICON.right, run(){ layout.side = !layout.side; store.save(layout); rebuild(); } });
  acts.push({ label:"Open stream", grp:"action", icon:ICON.reply, run:()=>toggleDrawer(true) });
  acts.push({ label:"Cycle theme (auto / light / dark)", grp:"action", icon:ICON.doc, run:()=>$("themeBtn").click() });
  acts.push({ label:"Open fleet", grp:"action", icon:ICON.board, run:()=>location.href="/fleet" });
  acts.push({ label:"New Claude session", grp:"action", icon:ICON.term, run:()=>$("newSess").click() });
  asks(S||{inbox:[]}).forEach(i => acts.push({ label:"Approve "+i.name, grp:"gate", icon:ICON.gate, run(){
    post("/api/inbox", { kind:"reply", re:i.name, text:"APPROVE" }); }}));
  return acts;
}
let cmdSel = 0, cmdFiltered = [];
function drawCmd(q){
  const acts = cmdActions();
  cmdFiltered = q ? acts.filter(a => a.label.toLowerCase().includes(q.toLowerCase())) : acts;
  cmdSel = Math.min(cmdSel, Math.max(0, cmdFiltered.length-1));
  $("cmdList").innerHTML = cmdFiltered.map((a,i) => `<div class="cmdrow ${i===cmdSel?"sel":""}" data-i="${i}">
    ${a.icon}<span>${esc(a.label)}</span><span class="grp">${a.grp}</span></div>`).join("")
    || `<div style="padding:14px;color:var(--mut);font-size:13px">No match.</div>`;
  $("cmdList").querySelectorAll("[data-i]").forEach(r => r.onclick = () => runCmd(+r.dataset.i));
}
function openCmd(){ $("cmdk").classList.add("open"); cmdSel=0; $("cmdInput").value=""; drawCmd(""); $("cmdInput").focus(); }
function closeCmd(){ $("cmdk").classList.remove("open"); }
function runCmd(i){ const a = cmdFiltered[i]; if(!a) return; closeCmd(); a.run(); }
$("cmdInput").addEventListener("input", e => { cmdSel=0; drawCmd(e.target.value); });
$("cmdInput").addEventListener("keydown", e => {
  if (e.key==="ArrowDown"){ e.preventDefault(); cmdSel=Math.min(cmdSel+1,cmdFiltered.length-1); drawCmd($("cmdInput").value); }
  else if (e.key==="ArrowUp"){ e.preventDefault(); cmdSel=Math.max(cmdSel-1,0); drawCmd($("cmdInput").value); }
  else if (e.key==="Enter"){ e.preventDefault(); runCmd(cmdSel); }
  else if (e.key==="Escape"){ closeCmd(); }
});
$("cmdk").addEventListener("click", e => { if (e.target.id==="cmdk") closeCmd(); });
addEventListener("keydown", e => {
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault();
    $("cmdk").classList.contains("open") ? closeCmd() : openCmd(); }
});

refresh();
const es = new EventSource("/events");
es.onmessage = refresh; es.onerror = offline;
setInterval(() => { if (document.body.classList.contains("offline")) refresh(); }, 4000);
</script>
</body>
