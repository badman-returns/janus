# Dropped in by /dm-init as .github/workflows/dm-proof.yml.
# Edit the test step to the project's own test command; the rest is generic.
name: dm-proof

on:
  push:
    branches: ["fix/**", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # monorepo in a subdir? add:  with: { package_json_file: <dir>/package.json }  and a defaults.run.working-directory
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
